<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Admin — Login</title>
<link rel="stylesheet" href="../wireframe-kit.css">
</head>
<body>
<div class="wf-label">Super Admin / Login</div>
<div class="wf-desc">Admin sign-in screen. Admin accounts are seeded out-of-band with no self-registration and no status/ban gate — only credential validation stands between login and the dashboard.</div>
<div class="wf-page">
    <div class="wf-topbar">
        <div class="wf-logo">PsyCare · Admin Portal</div>
    </div>
    <div class="wf-center">
        <div class="wf-card" style="width:380px;">
            <div class="wf-h1" style="text-align:center;">Admin Login</div>
            <label class="wf-field-label">Email</label>
            <div class="wf-field">admin@psycare.com</div>
            <label class="wf-field-label" style="margin-top:10px;">Password</label>
            <div class="wf-field">••••••••</div>
            <div class="wf-btn" style="width:100%; text-align:center; margin-top:16px;">Login</div>
        </div>
    </div>
</div>
</body>
</html>
